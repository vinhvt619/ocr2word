[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr2word"
version = "2.0.0"
description = "Local OCR web app that converts PDF, image, and Excel files to editable Word documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "PyMuPDF>=1.24,<2",
  "pdf2docx==0.5.8",
  "python-docx>=1.1,<2",
  "latex2mathml>=3.77,<4",
  "mathml2omml>=0.0.2,<0.1",
  "docxcompose>=1.4,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10.4,<13",
  "opencv-python-headless>=4.10,<6",
  "pytesseract>=0.3.13,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.27,<1",
  "reportlab>=4.2,<5",
]

[project.scripts]
ocr2word = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
